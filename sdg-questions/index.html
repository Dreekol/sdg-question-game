<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SDG question game</title>
  <meta name="description" content="Pick a number or roll the dice to get a question. An internal SDG game.">
  <meta name="theme-color" content="#0072CF">
  <link rel="icon" href="assets/sdg-logo-mark.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/sdg-logo-mark.png">
  <link rel="stylesheet" href="vendor/phosphor/icons.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint so there's no flash.
    try {
      var t = localStorage.getItem('sdg-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="assets/sdg-logo-mark.png" width="44" height="44" alt="SDG">
      <span class="brand-title">question game</span>
    </div>

    <div class="theme-switch" role="radiogroup" aria-label="Color theme">
      <button type="button" role="radio" data-theme-choice="light" aria-label="Light mode" title="Light">
        <i class="ph-light ph-sun" aria-hidden="true"></i>
      </button>
      <button type="button" role="radio" data-theme-choice="system" aria-label="Match system" title="Match system">
        <i class="ph-light ph-desktop" aria-hidden="true"></i>
      </button>
      <button type="button" role="radio" data-theme-choice="dark" aria-label="Dark mode" title="Dark">
        <i class="ph-light ph-moon" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="stage" aria-live="polite">
      <article class="card" id="card">
        <div class="card-meta">
          <div class="meta-left">
            <span class="badge" id="qBadge">#—</span>
            <span class="cat-tag" id="qCat" hidden></span>
          </div>
          <span class="count" id="qCount">loading questions…</span>
        </div>
        <p class="question" id="qText">Enter a number or press Randomize to get started.</p>
        <div class="card-nav">
          <button type="button" class="icon-btn" id="prevBtn" aria-label="Previous question">
            <i class="ph-light ph-caret-left" aria-hidden="true"></i>
          </button>
          <button type="button" class="icon-btn" id="copyBtn" aria-label="Copy link to this question">
            <i class="ph-light ph-link" aria-hidden="true"></i>
          </button>
          <button type="button" class="icon-btn" id="nextBtn" aria-label="Next question">
            <i class="ph-light ph-caret-right" aria-hidden="true"></i>
          </button>
        </div>
      </article>
    </section>

    <aside class="panel">
      <form class="pick" id="pickForm" autocomplete="off" novalidate>
        <label for="numInput" class="label">pick a number</label>
        <div class="pick-row">
          <input id="numInput" class="num-input" type="number" inputmode="numeric" min="1" step="1" placeholder="1" required>
          <button type="submit" class="btn btn-primary">
            <i class="ph-light ph-arrow-right" aria-hidden="true"></i>
            <span>Show</span>
          </button>
        </div>
        <p class="hint" id="rangeHint">&nbsp;</p>
      </form>

      <div class="divider"><span>or</span></div>

      <div class="themes">
        <div class="themes-head">
          <span class="label" id="themesLabel">themes</span>
          <button type="button" class="link-btn" id="allThemesBtn">Select all</button>
        </div>
        <div class="theme-chips" id="themeChips" role="group" aria-labelledby="themesLabel"></div>
        <p class="hint" id="themesHint">Numbers and Randomize use only the themes you select.</p>
      </div>

      <button type="button" class="btn btn-outline btn-block" id="randomBtn" aria-label="Randomize question">
        <i class="ph-light ph-shuffle" aria-hidden="true"></i>
        <span>Randomize</span>
      </button>

      <label class="toggle">
        <input type="checkbox" id="noRepeat" checked>
        <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
        <span>Skip questions already asked</span>
      </label>

      <div class="history">
        <div class="history-head">
          <span class="label">asked so far <span id="askedCount">(0)</span></span>
          <button type="button" class="link-btn" id="resetBtn">
            <i class="ph-light ph-arrow-counter-clockwise" aria-hidden="true"></i> Reset
          </button>
        </div>
        <ul class="chips" id="historyList" aria-label="Recently asked questions"></ul>
      </div>

      <p class="kbd-hint">Shortcuts: <kbd>R</kbd> random · <kbd>←</kbd> <kbd>→</kbd> previous / next</p>
    </aside>
  </main>

  <footer class="foot">SDG · Solution Design Group</footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
